; HealthSense firmware for the Seeed Studio XIAO nRF52840 Sense (Adafruit nRF52 core, SoftDevice S140).
; Build:  pio run          Upload over USB:  pio run -t upload          Serial monitor:  pio device monitor

[env:xiao_nrf52840_sense]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git#1.1.1
board = seeed-xiao-afruitnrf52-nrf52840-sense
framework = arduino
monitor_speed = 115200
lib_deps =
    https://github.com/Seeed-Studio/Seeed_Arduino_LSM6DS3.git#v2.0.8
    https://github.com/sparkfun/SparkFun_MAX3010x_Sensor_Library.git#v1.1.2
    https://github.com/adafruit/Adafruit_Sensor.git#1.1.15
